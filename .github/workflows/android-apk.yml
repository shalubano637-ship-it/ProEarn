name: Android APK and AAB

'on':
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/firebase-auth-migration-2026
    paths:
      - 'lib/**'
      - 'android/**'
      - 'supabase/**'
      - 'cloudflare/**'
      - 'web/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'assets/icon/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'lib/**'
      - 'android/**'
      - 'supabase/**'
      - 'cloudflare/**'
      - 'web/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'assets/icon/**'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK and AAB
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.0'
          cache: true

      - name: Install SVG rasterizer
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin

      - name: Generate PNG from final SVG icon
        run: |
          test -s assets/icon/app_icon.svg
          rsvg-convert -w 1024 -h 1024 assets/icon/app_icon.svg -o assets/icon/app_icon.png
          test -s assets/icon/app_icon.png

      - name: Set up Deno for Edge Function type checks
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check Firebase Edge Functions
        run: |
          deno check supabase/functions/firebase-auth-provision/index.ts
          deno check supabase/functions/firebase-google-bridge/index.ts
          deno check supabase/functions/delete-account/index.ts

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Android launcher icons
        run: dart run flutter_launcher_icons

      - name: Analyze Flutter code
        run: flutter analyze --no-pub --no-fatal-warnings --no-fatal-infos

      - name: Run Flutter tests
        run: flutter test --reporter expanded

      - name: Build debug APK
        run: flutter build apk --debug --verbose

      - name: Verify actual debug APK signing certificate for Google Sign-In
        run: |
          APK="build/app/outputs/flutter-apk/app-debug.apk"
          test -s "$APK"
          echo "Actual installed debug APK signing certificate:"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER" || { echo "apksigner not found under $ANDROID_HOME/build-tools"; exit 1; }
          echo "apksigner path: $APKSIGNER"
          echo "APK signer certificate details:"
          "$APKSIGNER" verify --print-certs "$APK"
          echo "Runner debug keystore certificate details:"
          DEBUG_KEYSTORE="$(find "$HOME" -path '*/.android/debug.keystore' -type f -print -quit)"
          test -n "$DEBUG_KEYSTORE" || { echo "Debug keystore not found"; exit 1; }
          keytool -list -v -keystore "$DEBUG_KEYSTORE" -storepass android -alias androiddebugkey
          echo "Configured Firebase Android OAuth certificate hashes:"
          grep -A 4 -B 2 'certificate_hash' android/app/google-services.json

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProSN-Debug-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Restore existing Android release signing key
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          test -n "$KEYSTORE_BASE64" || (echo "Missing ANDROID_KEYSTORE_BASE64 secret" && exit 1)
          test -n "$KEYSTORE_PASSWORD" || (echo "Missing ANDROID_KEYSTORE_PASSWORD secret" && exit 1)
          test -n "$KEY_ALIAS" || (echo "Missing ANDROID_KEY_ALIAS secret" && exit 1)
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          test -s android/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEYSTORE_PASSWORD
          EOF

      - name: Verify release signing certificate for Google Sign-In
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "Release signing certificate SHA-1:"
          keytool -list -v -keystore android/upload-keystore.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" | grep -E 'SHA1:|SHA-1:'
          echo "Configured Android OAuth certificate SHA-1:"
          grep -A 5 -B 2 'certificate_hash' android/app/google-services.json

      - name: Build signed release APK
        if: github.event_name != 'pull_request'
        run: flutter build apk --release --verbose

      - name: Upload signed release APK artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ProSN-Signed-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build signed Android App Bundle
        if: github.event_name != 'pull_request'
        run: flutter build appbundle --release --verbose

      - name: Upload signed AAB artifact for Play Console
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ProSN-Internal-Testing-AAB
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
