name: Android CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'lib/**'
      - 'android/**'
      - 'supabase/**'
      - 'web/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/**'
  push:
    branches:
      - main
    paths:
      - 'lib/**'
      - 'android/**'
      - 'supabase/**'
      - 'web/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  test-and-debug-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check account deletion Edge Functions
        run: |
          deno check supabase/functions/delete-account/index.ts
          deno check supabase/functions/delete-account-request/index.ts
          deno check supabase/functions/admin-moderate-report/index.ts
          deno check supabase/functions/r2-upload/index.ts
          deno check supabase/functions/imgbb-upload/index.ts

      - name: Syntax-check Cloudflare media Worker
        run: npx --yes esbuild cloudflare/media-gateway/worker.ts --bundle --platform=browser --target=es2022 --outfile=/tmp/prosn-media-worker.js

      - name: Analyze Flutter code
        run: flutter analyze --no-pub --no-fatal-warnings --no-fatal-infos

      - name: Run Flutter tests
        run: flutter test --reporter expanded

      - name: Build debug APK for smoke testing
        run: flutter build apk --debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ProSN-Debug-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  release-bundle:
    if: ${{ vars.ANDROID_RELEASE_SIGNING_CONFIGURED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Configure private release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          echo "$KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Build signed Play Store App Bundle
        run: flutter build appbundle --release

      - name: Upload signed App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: ProSN-Play-Store-AAB
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
