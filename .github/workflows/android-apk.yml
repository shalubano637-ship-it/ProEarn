name: Android APK

'on':
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'lib/**'
      - 'android/**'
      - 'supabase/**'
      - 'cloudflare/**'
      - 'web/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'assets/icon/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'lib/**'
      - 'android/**'
      - 'supabase/**'
      - 'cloudflare/**'
      - 'web/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'assets/icon/**'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Keep the CI SDK aligned with this app's AGP 8.12 / Gradle 8.14 toolchain.
          flutter-version: '3.41.0'
          cache: true

      - name: Install SVG rasterizer
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin

      - name: Generate PNG from final SVG icon
        run: |
          test -s assets/icon/app_icon.svg
          rsvg-convert -w 1024 -h 1024 assets/icon/app_icon.svg -o assets/icon/app_icon.png
          test -s assets/icon/app_icon.png

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Android launcher icons
        run: dart run flutter_launcher_icons

      - name: Analyze Flutter code
        run: flutter analyze --no-pub --no-fatal-warnings --no-fatal-infos

      - name: Run Flutter tests
        run: flutter test --reporter expanded

      - name: Build APK
        run: flutter build apk --debug --verbose

      - name: Upload direct APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProEarn-Debug-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
