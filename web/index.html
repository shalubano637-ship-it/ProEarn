<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="ProEarn — AI content social platform with reels, creators, gifts and an in-app economy.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ProEarn">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>ProEarn</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/nsfwjs@4.4.0/dist/nsfwjs.min.js"></script>
  <script>
    (function () {
      let modelPromise = null;
      window.proEarnNsfwLoad = async function () {
        if (modelPromise) return modelPromise;
        if (!window.tf || !window.nsfwjs) throw new Error('Browser moderation engine is unavailable');
        window.tf.enableProdMode();
        await window.tf.ready();
        modelPromise = window.nsfwjs.load();
        await modelPromise;
        return true;
      };
      window.proEarnNsfwCheck = async function (base64) {
        await window.proEarnNsfwLoad();
        const binary = atob(base64);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
        const bitmap = await createImageBitmap(new Blob([bytes]));
        const predictions = await (await modelPromise).classify(bitmap);
        bitmap.close();
        let unsafeScore = 0;
        let topClass = 'Safe';
        let topProbability = 0;
        for (const p of predictions) {
          if (p.className === 'Porn' || p.className === 'Hentai' || p.className === 'Sexy') {
            unsafeScore += p.probability;
            if (p.probability > topProbability) {
              topProbability = p.probability;
              topClass = p.className;
            }
          }
        }
        return JSON.stringify({unsafeScore, topClass, topProbability});
      };
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
