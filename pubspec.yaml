name: proearn
description: Pro Earn — AI content social platform with reels feed and an in-app coin/gift economy.
publish_to: 'none'

version: 1.0.12+13

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter

  sentry_flutter: ^9.30.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  
  supabase_flutter: ^2.8.2
  

  google_mobile_ads: ^6.0.0
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.3
  image_picker: ^1.2.1
  image: ^4.10.1
  nsfw_detector_flutter: ^2.0.2
  image_cropper: ^12.2.1
  share_plus: ^10.1.4
  path_provider: ^2.1.5
  package_info_plus: ^8.3.0
  flutter_image_compress: ^2.5.1
  permission_handler: ^11.3.1
  onesignal_flutter: ^5.6.10
  http: ^1.6.0
  url_launcher: ^6.3.2
  tflite_flutter: ^0.12.1
  universal_io: ^2.3.1
  record: ^6.2.1
  audioplayers: ^6.8.1
  
  
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.3
  flutter_launcher_icons: "^0.14.4" # Yeh line add karein
  fake_async: ^1.3.3 # ChestTimerService tests: deterministic control over Timer.periodic
  mocktail: ^1.0.5 # ChestTimerService tests: mock ChestRepository, no code-gen needed

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"

flutter:
  uses-material-design: true
