# Supabase Edge Functions configuration.
# Firebase ID tokens are verified inside r2-upload with Firebase Admin SDK.
# The gateway's legacy Supabase JWT verifier must not reject Firebase tokens first.
[functions.r2-upload]
verify_jwt = false

# The notify handler validates user JWTs itself and authenticates chest cron calls with CHEST_CRON_SECRET.
[functions.notify]
verify_jwt = false

# These endpoints validate Firebase/Google credentials inside the function.
# Supabase's legacy gateway JWT check must not reject those tokens first.
[functions.firebase-google-bridge]
verify_jwt = false

# Signup provisioning is protected by server-side validation and rate limiting.
[functions.firebase-auth-provision]
verify_jwt = false

# Account deletion validates the Firebase ID token with Firebase Admin SDK.
[functions.delete-account]
verify_jwt = false

[functions.delete-account-request]
verify_jwt = false

# Firebase ID tokens are verified inside the affected Edge Functions. Disable the
# legacy gateway verifier for these endpoints so Firebase tokens reach the handler.
[auth.third_party.firebase]
enabled = true
project_id = "proearn-6acdd"

[functions.admin-moderate-report]
verify_jwt = false

[functions.play-billing]
verify_jwt = false

[functions.voice-message]
verify_jwt = false
